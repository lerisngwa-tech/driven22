# Secrets store sensitive data (passwords, tokens, keys).
# Values must be base64 encoded.
# echo -n "mypassword" | base64  →  bXlwYXNzd29yZA==
apiVersion: v1
kind: Secret
metadata:
  name: landmark-secret
  namespace: landmark
type: Opaque
data:
  DB_PASSWORD: bXlwYXNzd29yZA==
  API_KEY: bXlhcGlrZXk=
