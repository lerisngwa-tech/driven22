# HorizontalPodAutoscaler automatically scales pods based on metrics.
# When CPU exceeds 70%, it scales up. When it drops, it scales down.
# Requires metrics-server to be installed in the cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: landmark-hpa
  namespace: landmark
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: landmark-hpa-demo
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
