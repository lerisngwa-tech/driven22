# Headless Service (clusterIP: None) for StatefulSet.
# This gives each pod a stable DNS name:
#   landmark-mysql-0.landmark-mysql-headless.landmark.svc.cluster.local
#   landmark-mysql-1.landmark-mysql-headless.landmark.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: landmark-mysql-headless
  namespace: landmark
spec:
  clusterIP: None
  selector:
    app: landmark-mysql
  ports:
  - port: 3306
    targetPort: 3306
