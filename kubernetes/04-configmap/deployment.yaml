# This Deployment uses envFrom to inject all ConfigMap keys as env vars.
# This decouples configuration from the container image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landmark-configmap-demo
  namespace: landmark
  labels:
    app: landmark-config-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: landmark-config-app
  template:
    metadata:
      labels:
        app: landmark-config-app
    spec:
      containers:
      - name: nodejs
        image: chafah/devopsapp:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: landmark-config
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
