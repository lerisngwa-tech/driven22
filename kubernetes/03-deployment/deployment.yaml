# A Deployment manages pods for you - provides:
#   - Self-healing (restarts crashed pods)
#   - Scaling (replicas)
#   - Rolling updates (zero-downtime deploys)
# This is the production way to run workloads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landmark-deployment
  namespace: landmark
  labels:
    app: landmark-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: landmark-app
  template:
    metadata:
      labels:
        app: landmark-app
    spec:
      containers:
      - name: nodejs
        image: lerisngwa/landmark_nodejsapp:v1.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
