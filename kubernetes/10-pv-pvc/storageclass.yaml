# PersistentVolume (PV) represents a piece of storage in the cluster.
# On AWS EKS, we use the EBS CSI driver to dynamically provision EBS volumes.
# This StorageClass tells Kubernetes to use gp3 EBS volumes.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
