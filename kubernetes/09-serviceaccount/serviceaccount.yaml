# ServiceAccount provides an identity for pods to interact with the Kubernetes API
# and AWS services (via IRSA - IAM Roles for Service Accounts).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: landmark-sa
  namespace: landmark
  annotations:
    # Replace with your actual IAM role ARN for IRSA
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/landmark-pod-role
