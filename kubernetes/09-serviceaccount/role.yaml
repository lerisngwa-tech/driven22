# Role defines what actions are allowed within the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: landmark-role
  namespace: landmark
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
# RoleBinding binds the Role to the ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: landmark-rolebinding
  namespace: landmark
subjects:
- kind: ServiceAccount
  name: landmark-sa
  namespace: landmark
roleRef:
  kind: Role
  name: landmark-role
  apiGroup: rbac.authorization.k8s.io
