# ExternalSecret defines WHAT to fetch from AWS Secrets Manager.
# It creates a regular Kubernetes Secret that pods can consume normally.
# The secret is auto-refreshed every hour — no manual rotation needed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: landmark-external-secret
  namespace: landmark
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: landmark-app-secret
    creationPolicy: Owner
  data:
  - secretKey: DB_HOST
    remoteRef:
      key: landmark/database
      property: host
  - secretKey: DB_PASSWORD
    remoteRef:
      key: landmark/database
      property: password
  - secretKey: DB_USERNAME
    remoteRef:
      key: landmark/database
      property: username
  - secretKey: API_KEY
    remoteRef:
      key: landmark/api-key
