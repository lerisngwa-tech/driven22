# ServiceAccount used by the SecretStore to authenticate with AWS.
# The IRSA annotation gives it permission to read from AWS Secrets Manager.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: landmark
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/ExternalSecretsRole
